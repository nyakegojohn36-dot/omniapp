# One push to main ships both halves: the container that serves the SPA and the
# API (Cloud Run), and the Firestore rules and indexes that container reads
# through. Nothing here needs a local gcloud install.
#
# Kept separate from ci.yml so a red typecheck blocks the rollout on its own
# signal, rather than being buried in a deploy log.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: sokoflow-whatsapp
  REGION: us-central1
  SERVICE: sokoflow
  REPOSITORY: sokoflow

jobs:
  # Deploying a commit that does not typecheck or pass its own tests is how a
  # broken build reaches production looking successful.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Keyless: GitHub's OIDC token is exchanged for short-lived deployer
      # credentials through Workload Identity Federation. The provider only accepts
      # tokens minted for this repository, so there is no long-lived key to leak.
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1015227499573/locations/global/workloadIdentityPools/github/providers/omniapp
          service_account: sokoflow-deployer@sokoflow-whatsapp.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      # Say out loud whose credentials these are, so a permissions failure a step
      # later is read against the right identity.
      - name: Show the deploying identity
        run: |
          ACCOUNT=$(gcloud auth list --filter=status:ACTIVE --format='value(account)')
          echo "Deploying as: $ACCOUNT"
          case "$ACCOUNT" in
            *iam.gserviceaccount.com) ;;
            *) echo "::warning::Expected a service account, got $ACCOUNT." ;;
          esac

      - name: Ensure the Artifact Registry repository exists
        run: |
          set -euo pipefail
          if gcloud artifacts repositories describe "$REPOSITORY" \
               --location "$REGION" --project "$PROJECT_ID" >/dev/null 2>&1; then
            echo "Repository $REPOSITORY already exists in $REGION."
          else
            # Needs roles/artifactregistry.admin. Writer can push to a repository
            # that exists but cannot create one, which is why the first run fails here.
            gcloud artifacts repositories create "$REPOSITORY" \
              --repository-format=docker \
              --location "$REGION" \
              --project "$PROJECT_ID" \
              --description "SokoFlow container images"
          fi

      - name: Build and push the image
        run: |
          gcloud builds submit \
            --project "$PROJECT_ID" \
            --config cloudbuild.yaml \
            --substitutions="_TAG=${GITHUB_SHA},_REGION=${REGION},_REPO=${REPOSITORY},_VITE_FIREBASE_API_KEY=${{ vars.VITE_FIREBASE_API_KEY }},_VITE_FIREBASE_AUTH_DOMAIN=${{ vars.VITE_FIREBASE_AUTH_DOMAIN }},_VITE_FIREBASE_PROJECT_ID=${{ vars.VITE_FIREBASE_PROJECT_ID }},_VITE_FIREBASE_APP_ID=${{ vars.VITE_FIREBASE_APP_ID }}"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --image "${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/app:${GITHUB_SHA}" \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --platform managed \
            --allow-unauthenticated \
            --update-env-vars "NODE_ENV=production,FIREBASE_PROJECT_ID=${PROJECT_ID},COMMERCE_STATE_BACKEND=firestore,SEED_REFERENCE_CATALOGUE=false,GEMINI_ENABLED=true,GEMINI_MODEL=gemini-3.8-flash,GEMINI_LOCATION=global,OWNER_EMAILS=${{ vars.OWNER_EMAILS }}"

      - name: Deploy Firestore rules and indexes
        run: |
          npx --yes firebase-tools deploy \
            --only firestore:rules,firestore:indexes \
            --project "$PROJECT_ID" \
            --non-interactive

      # Two things have gone wrong in this repository before: a green deploy that
      # still served the previous build, and a SPA built without its Firebase
      # config. Ask the running service about both instead of assuming.
      #
      # The assertions live in tools/smoke-deployed.mjs so the same code can be run
      # against a live URL from a developer machine before CI trusts it.
      - name: Smoke test the live service
        run: |
          set -euo pipefail
          URL=$(gcloud run services describe "$SERVICE" \
            --region "$REGION" --project "$PROJECT_ID" \
            --format 'value(status.url)')
          echo "Service URL: $URL"
          REQUIRE_GEMINI=true node tools/smoke-deployed.mjs "$URL" "$PROJECT_ID"
