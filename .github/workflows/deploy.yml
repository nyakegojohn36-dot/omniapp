# One push to main ships both halves: the container that serves the SPA and the
# API (Cloud Run), and the Firestore rules and indexes that container reads
# through. Nothing here needs a local gcloud install.
#
# Kept separate from ci.yml so a red typecheck blocks the rollout on its own
# signal, rather than being buried in a deploy log.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: sokoflow-whatsapp
  REGION: us-central1
  SERVICE: sokoflow
  REPOSITORY: sokoflow

jobs:
  # Deploying a commit that does not typecheck or pass its own tests is how a
  # broken build reaches production looking successful.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # These three checks exist so a bad secret reports its own defect instead of
      # surfacing as an opaque failure inside auth@v2, which only writes the file
      # and reads fields - it never calls Google, so its errors are all about shape.
      - name: Check GCP_SA_KEY is present
        env:
          KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::GCP_SA_KEY is empty or does not exist."
            exit 1
          fi
          echo "Secret is ${#KEY} characters long."

      - name: Check GCP_SA_KEY is valid JSON
        env:
          KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          printf '%s' "$KEY" > key.json
          if ! node -e 'JSON.parse(require("fs").readFileSync("key.json", "utf8"))'; then
            echo "::error::GCP_SA_KEY is not valid JSON. The usual cause is copying from a rendered or pretty-printed view, which puts real line breaks inside private_key."
            exit 1
          fi
          rm -f key.json

      - name: Check GCP_SA_KEY belongs to the deployer
        env:
          KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          EMAIL=$(printf '%s' "$KEY" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).client_email||"(none)")}catch(e){console.log("(unparseable)")}})')
          echo "Key belongs to: $EMAIL"
          case "$EMAIL" in
            sokoflow-deployer@*) ;;
            *) echo "::error::GCP_SA_KEY belongs to $EMAIL, not sokoflow-deployer@sokoflow-whatsapp.iam.gserviceaccount.com."; exit 1 ;;
          esac

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      # A JSON key from any service account authenticates, so a key that belongs
      # to the wrong account sails through auth and then fails on permissions a
      # step later. Say out loud whose credentials these are.
      - name: Show the deploying identity
        run: |
          ACCOUNT=$(gcloud auth list --filter=status:ACTIVE --format='value(account)')
          echo "Deploying as: $ACCOUNT"
          case "$ACCOUNT" in
            *iam.gserviceaccount.com) ;;
            *) echo "::warning::Expected a service account, got $ACCOUNT." ;;
          esac

      - name: Ensure the Artifact Registry repository exists
        run: |
          set -euo pipefail
          if gcloud artifacts repositories describe "$REPOSITORY" \
               --location "$REGION" --project "$PROJECT_ID" >/dev/null 2>&1; then
            echo "Repository $REPOSITORY already exists in $REGION."
          else
            # Needs roles/artifactregistry.admin. Writer can push to a repository
            # that exists but cannot create one, which is why the first run fails here.
            gcloud artifacts repositories create "$REPOSITORY" \
              --repository-format=docker \
              --location "$REGION" \
              --project "$PROJECT_ID" \
              --description "SokoFlow container images"
          fi

      - name: Build and push the image
        run: |
          gcloud builds submit \
            --project "$PROJECT_ID" \
            --config cloudbuild.yaml \
            --substitutions="_TAG=${GITHUB_SHA},_REGION=${REGION},_REPO=${REPOSITORY},_VITE_FIREBASE_API_KEY=${{ vars.VITE_FIREBASE_API_KEY }},_VITE_FIREBASE_AUTH_DOMAIN=${{ vars.VITE_FIREBASE_AUTH_DOMAIN }},_VITE_FIREBASE_PROJECT_ID=${{ vars.VITE_FIREBASE_PROJECT_ID }},_VITE_FIREBASE_APP_ID=${{ vars.VITE_FIREBASE_APP_ID }}"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --image "${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/app:${GITHUB_SHA}" \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --platform managed \
            --allow-unauthenticated \
            --update-env-vars "NODE_ENV=production,FIREBASE_PROJECT_ID=${PROJECT_ID},COMMERCE_STATE_BACKEND=firestore,OWNER_EMAILS=${{ vars.OWNER_EMAILS }}"

      - name: Deploy Firestore rules and indexes
        run: |
          npx --yes firebase-tools deploy \
            --only firestore:rules,firestore:indexes \
            --project "$PROJECT_ID" \
            --non-interactive

      # Two things have gone wrong in this repository before: a green deploy that
      # still served the previous build, and a SPA built without its Firebase
      # config. Ask the running service about both instead of assuming.
      - name: Smoke test the live service
        run: |
          set -euo pipefail
          URL=$(gcloud run services describe "$SERVICE" \
            --region "$REGION" --project "$PROJECT_ID" \
            --format 'value(status.url)')
          echo "Service URL: $URL"

          curl -fsS "$URL/health" | tee health.json
          grep -q '"commerce"' health.json ||
            { echo "::error::/health has no commerce block - the old build is still serving."; exit 1; }
          grep -q '"durable":true' health.json ||
            { echo "::error::Commerce is not durable - COMMERCE_STATE_BACKEND is not firestore."; exit 1; }

          # Proves the VITE_* build args reached the bundle. Without them the page
          # loads, sign-in is unavailable, and nothing explains why.
          curl -fsS "$URL/" > index.html
          BUNDLE=$(grep -o '/assets/[^"]*\.js' index.html | head -n 1)
          echo "Bundle: $BUNDLE"
          curl -fsS "$URL$BUNDLE" | grep -q "$PROJECT_ID" ||
            { echo "::error::The bundle has no Firebase project id - VITE_FIREBASE_* variables are missing or empty."; exit 1; }
          if grep -q 'MockWebSocket' index.html; then
            echo "::error::index.html still carries the dev HMR shim - the build did not run stripDevHmrShim."
            exit 1
          fi
          echo "Smoke tests passed."
