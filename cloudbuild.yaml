# Builds and pushes the production image.
#
# Cloud Run cannot supply build-time values, and .dockerignore deliberately keeps
# .env out of the build context, so the four VITE_* identifiers are passed as
# --build-arg substitutions. Everything secret stays out of the image and is set
# as runtime env vars on the Cloud Run service instead.
#
#   gcloud builds submit \
#     --config cloudbuild.yaml \
#     --substitutions=_TAG=$GIT_SHA,_VITE_FIREBASE_API_KEY=...,...

substitutions:
  _TAG: latest
  _REGION: us-central1
  _REPO: sokoflow
  _VITE_FIREBASE_API_KEY: ''
  _VITE_FIREBASE_AUTH_DOMAIN: ''
  _VITE_FIREBASE_PROJECT_ID: ''
  _VITE_FIREBASE_APP_ID: ''

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/app:${_TAG}'

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - '--build-arg=VITE_FIREBASE_API_KEY=${_VITE_FIREBASE_API_KEY}'
      - '--build-arg=VITE_FIREBASE_AUTH_DOMAIN=${_VITE_FIREBASE_AUTH_DOMAIN}'
      - '--build-arg=VITE_FIREBASE_PROJECT_ID=${_VITE_FIREBASE_PROJECT_ID}'
      - '--build-arg=VITE_FIREBASE_APP_ID=${_VITE_FIREBASE_APP_ID}'
      - '-t=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/app:${_TAG}'
      - .
